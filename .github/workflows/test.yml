# ==============================================================================
# GitHub Actions — Lint and Test
# ==============================================================================
# Runs ShellCheck and the bats test suite on every push and pull request.
# ==============================================================================

name: Lint and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run ShellCheck
        run: |
          shellcheck -x -P scripts -P scripts/lib \
            scripts/sonar-report.sh \
            scripts/wait-for-analysis.sh \
            scripts/lib/*.sh

  test:
    name: bats test suite + coverage (kcov)
    runs-on: ubuntu-latest
    env:
      # kcov was dropped from Ubuntu's repos (24.04+) and ships no prebuilt
      # binaries, so we build it from source and cache the result.
      KCOV_VERSION: v43
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install runtime dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats jq parallel libcurl4 libdw1 libelf1 libbinutils

      - name: Cache kcov
        id: cache-kcov
        uses: actions/cache@v5
        with:
          path: ~/.local/kcov
          key: kcov-${{ env.KCOV_VERSION }}-${{ runner.os }}

      - name: Build kcov from source
        if: steps.cache-kcov.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y \
            build-essential cmake binutils-dev \
            libcurl4-openssl-dev libdw-dev libelf-dev \
            libiberty-dev zlib1g-dev libssl-dev libstdc++-12-dev
          tmpdir="$(mktemp -d)"
          git clone --depth 1 --branch "${KCOV_VERSION}" \
            https://github.com/SimonKagstrom/kcov.git "${tmpdir}/kcov"
          cmake -S "${tmpdir}/kcov" -B "${tmpdir}/build" \
            -DCMAKE_INSTALL_PREFIX="${HOME}/.local/kcov"
          cmake --build "${tmpdir}/build" --parallel "$(nproc)"
          cmake --install "${tmpdir}/build"
          rm -rf "${tmpdir}"

      - name: Add kcov to PATH
        run: echo "${HOME}/.local/kcov/bin" >> "$GITHUB_PATH"

      - name: Verify tool versions
        run: |
          bats --version
          jq --version
          kcov --version

      - name: Run coverage
        run: bash tests/run_coverage.sh --min-coverage 92

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: reports/coverage/
          retention-days: 14

  bash-floor:
    name: Minimum bash version (4.4) smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Guards the documented floor. CI/Docker otherwise run bash 5.2, so a
      # regression to a 4.5+/5.x-only feature would go unnoticed until a user
      # hits it on an older system. Run the real report path on bash:4.4.
      - name: Run the report on bash 4.4 (documented minimum)
        run: |
          docker run --rm -v "$PWD":/app:ro bash:4.4 bash -c '
            set -e
            apk add --no-cache jq gawk coreutils >/dev/null
            mkdir -p /tmp/out
            bash /app/scripts/sonar-report.sh --dry-run /app/tests/fixtures/report_data.json \
              --formats json,md,html,csv --output-dir /tmp/out
            ls /tmp/out/*.json /tmp/out/*.html /tmp/out/*.md >/dev/null
          '

      - name: Verify the version guard rejects bash older than 4.4
        run: |
          output="$(docker run --rm -v "$PWD":/app:ro bash:4.2 \
            bash /app/scripts/sonar-report.sh --help 2>&1)" && status=0 || status=$?
          echo "$output"
          if [ "$status" -eq 0 ]; then
            echo "::error::bash 4.2 should have been rejected by the version guard"
            exit 1
          fi
          echo "$output" | grep -q "requires bash 4.4+" \
            || { echo "::error::missing 'requires bash 4.4+' guard message"; exit 1; }
