# ==============================================================================
# GitHub Actions — Lint and Test
# ==============================================================================
# Runs ShellCheck and the bats test suite on every push and pull request.
# ==============================================================================

name: Lint and Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run ShellCheck
        run: |
          shellcheck -x -P scripts -P scripts/lib \
            scripts/sonar-report.sh \
            scripts/wait-for-analysis.sh \
            scripts/lib/*.sh

  test:
    name: bats test suite + coverage (kcov)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bats jq

      - name: Install kcov (prebuilt)
        uses: taiki-e/install-action@v2
        with:
          tool: kcov

      - name: Verify tool versions
        run: |
          bats --version
          jq --version
          kcov --version

      - name: Run coverage
        run: bash tests/run_coverage.sh --min-coverage 92

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/coverage/
          retention-days: 14
