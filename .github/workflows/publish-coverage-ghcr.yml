name: Publish Coverage Image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-coverage:
    name: Build and Push Coverage Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          : "${GITHUB_REPOSITORY:?GITHUB_REPOSITORY is required}"
          # GHCR repository names must be lowercase.
          image_repo="ghcr.io/${GITHUB_REPOSITORY,,}-coverage"
          echo "image_repo=$image_repo" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./coverage.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image_repo }}:latest
